# .NET Build and Test Workflow

name: Build and Test

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      HUSKY: 0  # don't run husky.net hooks

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          # .net 4.8.x is included by default in windows-latest
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore
        working-directory: .

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./src

      - name: Build
        run: dotnet build ./src --no-restore -p:VersionFromCI="0.0.0-cibuild"

      - name: Test
        run: dotnet test ./src --no-build --verbosity normal

  smoke-test:
    name: Smoke Test (${{ matrix.os }} / ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    needs: build
    env:
      HUSKY: 0

    strategy:
      fail-fast: false
      matrix:
        include:
          # netstandard2.0 asset — must run on Windows (.NET Framework)
          - os: windows-latest
            framework: net48
          # dedicated net8/9/10 assets — run on Linux for OS coverage
          - os: ubuntu-latest
            framework: net8.0
          - os: ubuntu-latest
            framework: net9.0
          - os: ubuntu-latest
            framework: net10.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack Arcus into local feed
        shell: bash
        run: |
          mkdir -p Arcus.SmokeTests/feed
          dotnet pack src/Arcus/Arcus.csproj \
            --configuration Release \
            --output Arcus.SmokeTests/feed \
            -p:VersionFromCI=99.0.0-smoke \
            --verbosity quiet

      - name: Restore SmokeTests consumer
        run: dotnet restore Arcus.SmokeTests/SmokeTests/SmokeTests.csproj -p:ArcusVersion=99.0.0-smoke --verbosity quiet

      - name: Build SmokeTests consumer
        run: dotnet build Arcus.SmokeTests/SmokeTests/SmokeTests.csproj --no-restore --configuration Release -p:ArcusVersion=99.0.0-smoke --verbosity quiet

      - name: Run smoke tests (${{ matrix.framework }})
        run: >
          dotnet run
          --project Arcus.SmokeTests/SmokeTests/SmokeTests.csproj
          --framework ${{ matrix.framework }}
          --configuration Release
          --no-build
          -p:ArcusVersion=99.0.0-smoke
